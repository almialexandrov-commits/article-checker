<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Предварительная проверка статьи | Вестник ЕДС</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; color: #333; line-height: 1.6; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #800020; padding-bottom: 15px; }
        .header h1 { color: #800020; margin: 0; }
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; background: #fafafa; }
        .upload-area:hover { border-color: #800020; }
        .btn { background-color: #800020; color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background-color: #5a0016; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #result { margin-top: 30px; display: none; }
        .error-box { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; border: 1px solid #f5c6cb; margin-bottom: 10px; }
        .warning-box { background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; border: 1px solid #ffeeba; margin-bottom: 10px; }
        .info-box { background: #d1ecf1; color: #0c5460; padding: 15px; border-radius: 5px; border: 1px solid #bee5eb; margin-bottom: 10px; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #800020; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Автопроверка оформления статьи</h1>
        <p>Сервис проверит базовое соответствие требованиям Руководства для авторов Вестника ЕДС.</p>
    </div>

    <div class="upload-area">
        <input type="file" id="fileInput" accept=".docx" style="font-size: 16px;">
        <br>
        <button id="checkBtn" class="btn" onclick="checkFile()" disabled>Проверить статью</button>
        <div style="font-size: 14px; color: #666; margin-top: 10px;">⚠️ Принимаются только файлы в формате <b>.docx</b></div>
    </div>

    <div class="loader" id="loader"></div>

    <div id="result">
        <h2 id="resultTitle"></h2>
        <div id="reportContent"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const checkBtn = document.getElementById('checkBtn');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const reportContent = document.getElementById('reportContent');

        fileInput.addEventListener('change', () => {
            checkBtn.disabled = !fileInput.files.length;
            resultDiv.style.display = 'none';
        });

        async function checkFile() {
            const file = fileInput.files[0];
            if (!file) return;

            checkBtn.disabled = true;
            loader.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/check', { method: 'POST', body: formData });
                const data = await response.json();

                if (response.ok) {
                    resultDiv.style.display = 'block';
                    if (data.is_valid) {
                        resultTitle.innerText = "✅ Грубых структурных ошибок не найдено!";
                        resultTitle.style.color = "#155724";
                    } else {
                        resultTitle.innerText = "⚠️ Найдены замечания к оформлению";
                        resultTitle.style.color = "#721c24";
                    }

                    let html = '';
                    data.errors.forEach(err => {
                        if (err.startsWith("❌")) html += `<div class="error-box">${err}</div>`;
                        else if (err.startsWith("⚠️")) html += `<div class="warning-box">${err}</div>`;
                        else html += `<div class="info-box">${err}</div>`;
                    });
                    reportContent.innerHTML = html;
                } else {
                    alert("Ошибка: " + data.detail);
                }
            } catch (error) {
                alert("Произошла ошибка при соединении с сервером.");
            } finally {
                loader.style.display = 'none';
                checkBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
