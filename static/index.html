<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка статьи | Вестник ЕДС</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            color: #333; 
            line-height: 1.6; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #800020; 
            padding-bottom: 15px; 
        }
        .header h1 { 
            color: #800020; 
            margin: 0; 
        }
        .upload-area { 
            border: 2px dashed #ccc; 
            border-radius: 8px; 
            padding: 40px; 
            text-align: center; 
            background: #fafafa; 
        }
        .upload-area:hover { 
            border-color: #800020; 
        }
        .btn { 
            background-color: #800020; 
            color: white; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: background 0.3s; 
        }
        .btn:hover { 
            background-color: #5a0016; 
        }
        .btn:disabled { 
            background-color: #ccc; 
            cursor: not-allowed; 
        }
        
        /* Результаты проверки */
        #result { 
            margin-top: 30px; 
            display: none; 
        }
        
        .summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .summary h2 {
            margin-top: 0;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        
        .stat-item {
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .stat-errors {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stat-warnings {
            background: #fff3cd;
            color: #856404;
        }
        
        /* Статья с подсветкой */
        .article-viewer {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 30px;
            background: white;
            margin-top: 20px;
        }
        
        .article-viewer h3 {
            margin-top: 0;
            color: #800020;
        }
        
        .paragraph {
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 3px;
            transition: background 0.3s;
        }
        
        .paragraph.error {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            cursor: pointer;
        }
        
        .paragraph.error:hover {
            background: #ffe69c;
        }
        
        .paragraph.error.critical {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        /* Список ошибок */
        .errors-list {
            margin-top: 30px;
        }
        
        .error-item {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid;
        }
        
        .error-item.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        .error-item.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        
        .error-item.info {
            background: #d1ecf1;
            border-left-color: #17a2b8;
        }
        
        .error-category {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .error-message {
            margin: 5px 0;
        }
        
        .error-suggestions {
            font-style: italic;
            color: #666;
            margin-top: 5px;
        }
        
        .loader { 
            display: none; 
            margin: 20px auto; 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #800020; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            background: #e9ecef;
            border: none;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-size: 16px;
        }
        
        .tab.active {
            background: #800020;
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Автопроверка оформления статьи</h1>
        <p>Сервис проверит соответствие требованиям Руководства для авторов Вестника ЕДС.</p>
    </div>

    <div class="upload-area">
        <input type="file" id="fileInput" accept=".docx" style="font-size: 16px;">
        <br>
        <button id="checkBtn" class="btn" onclick="checkFile()" disabled>Проверить статью</button>
        <div style="font-size: 14px; color: #666; margin-top: 10px;">⚠️ Принимаются только файлы в формате <b>.docx</b></div>
    </div>

    <div class="loader" id="loader"></div>

    <div id="result">
        <div class="summary">
            <h2 id="resultTitle"></h2>
            <div class="stats">
                <div class="stat-item stat-errors" id="errorCount">Ошибки: 0</div>
                <div class="stat-item stat-warnings" id="warningCount">Предупреждения: 0</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('article')">📄 Статья с пометками</button>
            <button class="tab" onclick="showTab('errors')">📋 Список замечаний</button>
        </div>

        <div id="articleTab" class="tab-content active">
            <div class="article-viewer">
                <h3>Текст статьи (проблемные места выделены)</h3>
                <div id="articleContent"></div>
            </div>
        </div>

        <div id="errorsTab" class="tab-content">
            <div class="errors-list" id="errorsList"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const checkBtn = document.getElementById('checkBtn');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const errorCount = document.getElementById('errorCount');
        const warningCount = document.getElementById('warningCount');
        const articleContent = document.getElementById('articleContent');
        const errorsList = document.getElementById('errorsList');

        fileInput.addEventListener('change', () => {
            checkBtn.disabled = !fileInput.files.length;
            resultDiv.style.display = 'none';
        });

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tabName === 'article') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('articleTab').classList.add('active');
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('errorsTab').classList.add('active');
            }
        }

        async function checkFile() {
            const file = fileInput.files[0];
            if (!file) return;

            checkBtn.disabled = true;
            loader.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/check', { method: 'POST', body: formData });
                const data = await response.json();

                if (response.ok) {
                    resultDiv.style.display = 'block';
                    
                    if (data.is_valid) {
                        resultTitle.innerText = "✅ Грубых структурных ошибок не найдено!";
                        resultTitle.style.color = "#155724";
                    } else {
                        resultTitle.innerText = "⚠️ Найдены замечания к оформлению";
                        resultTitle.style.color = "#721c24";
                    }

                    errorCount.innerText = `Ошибки: ${data.total_errors || 0}`;
                    warningCount.innerText = `Предупреждения: ${data.total_warnings || 0}`;

                    // Отображаем статью
                    if (data.article_html) {
                        articleContent.innerHTML = data.article_html;
                    }

                    // Отображаем список ошибок
                    let errorsHtml = '';
                    data.errors.forEach(err => {
                        let suggestionsHtml = '';
                        if (err.suggestions) {
                            suggestionsHtml = `<div class="error-suggestions">Варианты: ${err.suggestions.join(', ')}</div>`;
                        }
                        
                        const errorClass = err.type === 'error' ? 'error' : (err.type === 'warning' ? 'warning' : 'info');
                        const icon = err.type === 'error' ? '❌' : (err.type === 'warning' ? '⚠️' : 'ℹ️');
                        
                        errorsHtml += `
                            <div class="error-item ${errorClass}">
                                <div class="error-category">${icon} ${err.category}</div>
                                <div class="error-message">${err.message}</div>
                                ${suggestionsHtml}
                            </div>
                        `;
                    });
                    errorsList.innerHTML = errorsHtml;
                    
                } else {
                    alert("Ошибка: " + data.detail);
                }
            } catch (error) {
                alert("Произошла ошибка при соединении с сервером.");
            } finally {
                loader.style.display = 'none';
                checkBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
